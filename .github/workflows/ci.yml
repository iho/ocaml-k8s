name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["5.1", "5.2", "5.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Use OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Install dependencies
        # --deps-only grabs k8s.opam's deps (the library's), which is not
        # enough for the full default build: gen/ needs yaml and generated/
        # needs ppx_deriving_yojson, neither of which the library itself
        # depends on (see README "Building and testing this repo"). Install
        # those extra build/test deps explicitly so `dune build` of the
        # whole workspace works.
        run: |
          opam install --deps-only --with-test --with-doc .
          opam install yaml ppx_deriving_yojson

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest
