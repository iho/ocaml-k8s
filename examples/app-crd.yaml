apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.example.com
spec:
  group: example.com
  names:
    kind: App
    plural: apps
    singular: app
    listKind: AppList
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      # No `subresources: { status: {} }` -- unlike webapp-crd.yaml, this
      # Kind has no status subresource at all (see bin/owned_child_demo.ml):
      # its only job is owning a child ConfigMap, which is itself the
      # observable result, not something worth a separate status write.
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
              required: [image]
          required: [spec]
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
