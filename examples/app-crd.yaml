apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.example.com
spec:
  group: example.com
  names:
    kind: App
    plural: apps
    singular: app
    listKind: AppList
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      # No `subresources: { status: {} }` -- unlike webapp-crd.yaml, this
      # Kind has no status subresource at all (see bin/owned_child_demo.ml):
      # its only job is owning a child ConfigMap, which is itself the
      # observable result, not something worth a separate status write.
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                replicas:
                  # Optional, and unused by bin/owned_child_demo.ml's App
                  # (whose reconciler never reads it) -- present purely so
                  # bin/webhook_demo.ml's validating webhook has a field
                  # to reject on; without it here, the API server's own
                  # strict structural-schema check would reject an
                  # out-of-range value before admission ever ran.
                  type: integer
              required: [image]
          required: [spec]
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
